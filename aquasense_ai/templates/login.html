{% extends 'base.html' %}
{% block title %}Login - AquaSense AI{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:80vh;padding:40px 24px;">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:40px;">
      <h1 style="font-size:2rem;">Welcome back</h1>
      <p class="mt-1">Sign in to submit reports and view your history</p>
    </div>
    <div class="card">
      <div id="alert-box"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
      </div>
      <button onclick="doLogin()" class="btn btn-primary" style="width:100%;" id="login-btn">Sign in</button>
      <p class="text-center mt-3" style="font-size:.9rem;">No account? <a href="/register/">Register here</a></p>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('login-btn');
  const alertBox=document.getElementById('alert-box');
  if(!email||!password){alertBox.innerHTML='<div class="alert alert-danger">Please fill in all fields.</div>';return;}
  btn.textContent='Signing in...';btn.disabled=true;
  try{
    const res=await fetch('/api/auth/login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(res.ok){
      localStorage.setItem('access_token',data.access);
      localStorage.setItem('refresh_token',data.refresh);
      localStorage.setItem('user',JSON.stringify(data.user));
      window.location.href='/dashboard/';
    }else{
      alertBox.innerHTML='<div class="alert alert-danger">Invalid email or password.</div>';
      btn.textContent='Sign in';btn.disabled=false;
    }
  }catch(e){alertBox.innerHTML='<div class="alert alert-danger">Network error.</div>';btn.textContent='Sign in';btn.disabled=false;}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
{% endblock %}
